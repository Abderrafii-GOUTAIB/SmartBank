# SmartBank configuration
# server (Spring Boot web)
server.port=8080
# SmartBank config (ready for when Spring injects them)
smartbank.account.minimum-deposit=100
# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:smartbank
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=smartbank
spring.datasource.password=smartbank
# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
# H2 console (view the DB in a browser at /h2-console)
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

